<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HOPE 랩 키우기</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HOPE 랩">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#eef7f6; --card:#fff; --text:#13232b; --sub:#5f7480; --line:#d6e6e4;
  --pri:#0f766e; --pri-t:#fff; --acc:#f59e0b; --ok:#16a34a; --scene1:#e0f2f1; --scene2:#b2dfdb; --bench:#8d6e63;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b1416; --card:#13222a; --text:#e8f3f2; --sub:#8fa8b3; --line:#223943;
    --pri:#2dd4bf; --pri-t:#062b27; --acc:#fbbf24; --ok:#4ade80; --scene1:#16313a; --scene2:#1d434c; --bench:#6d4c41; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#top{position:sticky;top:0;z-index:6;background:var(--pri);color:var(--pri-t);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;text-align:center}
#fund{font-size:26px;font-weight:800;letter-spacing:-.5px}
#cpsline{font-size:13px;opacity:.9}
#app{max-width:640px;margin:0 auto;padding:14px 14px calc(84px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 8px}
.sub{color:var(--sub);font-size:13px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 14px;background:var(--pri);color:var(--pri-t);cursor:pointer;touch-action:manipulation}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--line)}
button.danger{background:transparent;color:#dc2626;border:1px solid var(--line)}
button:disabled{opacity:.38}
textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);min-height:90px;-webkit-user-select:text;user-select:text}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:7}
.tabs button{flex:1;background:none;color:var(--sub);border-radius:0;padding:9px 2px 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.tabs button span{font-size:21px;line-height:1.1}
.tabs button.on{color:var(--pri)}
.dot{position:absolute;top:5px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:#ef4444}

/* 연구실 */
.scene{position:relative;background:linear-gradient(var(--scene1),var(--scene2));border-radius:18px;border:1px solid var(--line);padding:14px 10px 0;overflow:hidden;margin-bottom:12px;min-height:330px}
.sign{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;letter-spacing:2px;color:var(--pri);opacity:.8}
.pi{display:block;margin:16px auto 0;width:128px;cursor:pointer;touch-action:manipulation;transition:transform .08s}
.pi svg{width:100%;height:auto;display:block;pointer-events:none}
.pi.pop{animation:pop .22s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-3deg)}100%{transform:scale(1)}}
.hint{text-align:center;font-weight:800;margin:4px 0 0}
.hint small{display:block;font-weight:600;color:var(--sub)}
.crew{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;margin-top:12px;padding:10px 6px 0;min-height:84px;background:linear-gradient(transparent,rgba(0,0,0,.06))}
.mate{position:relative;width:52px;animation:bob 1.6s ease-in-out infinite}
.mate svg{width:100%;height:auto;display:block}
.mate b{position:absolute;right:-2px;bottom:2px;background:var(--pri);color:var(--pri-t);font-size:10px;border-radius:9px;padding:0 5px;line-height:16px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bench{height:14px;background:var(--bench);margin:0 -10px}
.float{position:absolute;font-weight:900;color:var(--acc);text-shadow:0 1px 0 rgba(0,0,0,.25);pointer-events:none;animation:rise .9s ease-out forwards;z-index:3;font-size:18px}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
.idea{position:absolute;font-size:38px;background:none;padding:0;border-radius:50%;animation:pulse 1s infinite;z-index:4;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
@keyframes pulse{50%{transform:scale(1.18)}}
.scene3d{padding:0;height:min(50vh,390px);min-height:320px;background:linear-gradient(#fff1f2,#e0f2fe)}
#gl{position:absolute;inset:0}
.modebtn{position:absolute;top:8px;right:8px;z-index:5;padding:5px 10px;font-size:12px;background:rgba(255,255,255,.85);color:var(--pri);border:1px solid var(--line)}
.expbtn{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;padding:10px 22px;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap}
.expbtn small{display:block;font-weight:600;font-size:11px;opacity:.9}
.tip{position:absolute;z-index:6;background:rgba(19,35,43,.92);color:#fff;font-size:12px;padding:6px 10px;border-radius:10px;pointer-events:none;transform:translate(-50%,-120%);white-space:nowrap}
.hint3{position:absolute;left:10px;top:10px;z-index:5;font-size:11px;color:#475569;background:rgba(255,255,255,.7);padding:3px 8px;border-radius:8px;pointer-events:none}
.mbar{height:7px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:5px;flex:1}
.mbar i{display:block;height:100%}
.nd{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}.nd span{width:84px;color:var(--sub)}.nd b{width:28px;text-align:right}
.lg{font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}.lg:last-child{border:0}.lg.bad{color:#dc2626}.lg.good{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(19,35,43,.94);color:#fff;padding:8px 16px;border-radius:12px;font-size:14px;z-index:30}
.night{position:absolute;inset:0;background:#0b1b4a;mix-blend-mode:multiply;pointer-events:none;z-index:2;opacity:0;transition:opacity .8s}
.alert{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px}.alert .grow{color:#dc2626;font-weight:700}
.empty{color:var(--sub);text-align:center;padding:18px 6px;width:100%}

/* 목록 */
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;background:var(--card);color:var(--sub);border:1px solid var(--line);padding:8px}
.seg button.on{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .av{width:46px;flex:none}
.row .av svg{width:100%;height:auto;display:block}
.grow{flex:1;min-width:0}
.rn{font-weight:800}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--sub);margin-left:4px;vertical-align:1px}
.buy{min-width:92px;text-align:center;line-height:1.25}
.buy small{display:block;font-weight:600;opacity:.9;font-size:11px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.stat div:nth-child(odd){color:var(--sub)}
.stat div:nth-child(even){text-align:right;font-weight:700}
.big{font-size:30px;font-weight:900;text-align:center;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal .card{max-width:360px;width:100%;text-align:center;margin:0}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--pri)}
</style>
</head>
<body>
<div id="top"><div id="fund">0원</div><div id="cpsline"></div></div>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="modal"></div>
<div class="toast" id="toast" style="display:none"></div>

<script src="three.min.js"></script>
<script src="lab3d.js"></script>
<script>
"use strict";
/* ====================== 데이터 ====================== */
const ROLES = [
  {id:0,name:"학부 연구생",base:15,cps:0.1,hair:"short",hc:"#2b2118",skin:"#f2c9a5",shirt:"#7dd3fc",acc:"none",desc:"열정 하나는 최고인 새내기"},
  {id:1,name:"석사과정",base:100,cps:1,hair:"long",hc:"#4b2e1e",skin:"#efc3a0",shirt:"#a5b4fc",acc:"glasses",desc:"장비 사용법을 마스터하는 중"},
  {id:2,name:"박사과정",base:1100,cps:8,hair:"bun",hc:"#1f1f2e",skin:"#e8b896",shirt:"#86efac",acc:"glasses",desc:"밤샘 실험이 일상인 에이스"},
  {id:3,name:"포닥",base:12000,cps:47,hair:"curly",hc:"#6b3a1a",skin:"#c98f66",shirt:"#fde68a",acc:"goggles",desc:"논문을 척척 써내는 연구원"},
  {id:4,name:"연구교수",base:130000,cps:260,hair:"short",hc:"#9ca3af",skin:"#f0c8a8",shirt:"#fca5a5",acc:"tie",desc:"과제를 이끄는 중견 연구자"},
  {id:5,name:"책임연구원",base:1400000,cps:1400,hair:"bald",hc:"#3a2a22",skin:"#d9a47a",shirt:"#c4b5fd",acc:"glasses",desc:"산업체와 협업하는 베테랑"},
  {id:6,name:"석학 교수",base:20000000,cps:7800,hair:"white",hc:"#f3f4f6",skin:"#f2cfb0",shirt:"#fcd34d",acc:"medal",desc:"학계가 주목하는 노벨상 후보"},
  {id:7,name:"연구소장",base:330000000,cps:44000,hair:"side",hc:"#6b7280",skin:"#e9bf9c",shirt:"#f9a8d4",acc:"tie",desc:"HOPE 연구소를 이끄는 리더"}
];
const PI = {name:"나",hair:"short",hc:"#2b2118",skin:"#f2c9a5",shirt:"#f87171",acc:"glasses",flask:true};

const RN = [
  ["연구노트 & 형광펜","전용 책상과 의자","국가장학금","연구실 우수 인턴상"],
  ["XRD 사용권","SEM 사용권","학회 포스터 발표","석사 논문 우수상"],
  ["글러브박스","TEM 사용권","국제 공동 연구","SCI 논문 게재"],
  ["ALD 장비","고성능 서버","해외 연수","연구재단 신진과제"],
  ["클린룸 확보","연구센터 설립","대형 과제 수주","산학협력 네트워크"],
  ["싱크로트론 빔타임","슈퍼컴퓨터 할당","특허 포트폴리오","기술이전 계약"],
  ["양자 시뮬레이터","국제 컨소시엄","석학 초청 강연","학술원 회원 선임"],
  ["거대 연구 인프라","국가 R&D 총괄","글로벌 연구거점","HOPE 재단 설립"]
];
const UPG = [
  {id:"c1",name:"피펫 & 비커 세트",desc:"실험 수익 ×2",cost:100,type:"click",m:2},
  {id:"c2",name:"전자저울",desc:"실험 수익 ×2",cost:1500,type:"click",m:2},
  {id:"k1",name:"자동 측정기",desc:"실험 수익 +초당 수익의 1%",cost:20000,type:"cpsclick",v:0.01},
  {id:"c3",name:"자기 교반기",desc:"실험 수익 ×2",cost:100000,type:"click",m:2},
  {id:"k2",name:"데이터 자동 수집",desc:"실험 수익 +초당 수익의 1%",cost:2e6,type:"cpsclick",v:0.01},
  {id:"c4",name:"고성능 분석 소프트웨어",desc:"실험 수익 ×2",cost:5e7,type:"click",m:2},
  {id:"k3",name:"AI 분석 파이프라인",desc:"실험 수익 +초당 수익의 2%",cost:1e9,type:"cpsclick",v:0.02},
  {id:"g1",name:"연구실 증축",desc:"모든 연구원 수익 ×1.25",cost:5000,type:"all",m:1.25},
  {id:"g2",name:"교내 연구비 지원",desc:"모든 연구원 수익 ×1.5",cost:300000,type:"all",m:1.5},
  {id:"g3",name:"국책 과제 선정",desc:"모든 연구원 수익 ×2",cost:2e7,type:"all",m:2},
  {id:"g4",name:"대형 연구센터 유치",desc:"모든 연구원 수익 ×2",cost:3e9,type:"all",m:2},
  {id:"g5",name:"국제 공동 연구 네트워크",desc:"모든 연구원 수익 ×3",cost:5e11,type:"all",m:3}
];
ROLES.forEach(r=>{
  [[5,10,2],[25,100,2],[50,3000,2],[100,200000,3]].forEach(([req,cm,m],k)=>{
    UPG.push({id:`r${r.id}_${k}`,name:RN[r.id][k],desc:`${r.name} 수익 ×${m}`,cost:r.base*cm,type:"res",i:r.id,m,req});
  });
});

const GROW = 1.15;
const OFFLINE_CAP = 8*3600;
const PAPER_BASE = 1e7;       // 논문 1편에 필요한 누적 연구비
const PAPER_BONUS = 0.10;     // 논문 1편당 수익 보너스

/* ====================== 저장/상태 ====================== */
const KEY = "hopelab.v1";
const JOBS_OK=["work","eat","sleep","brk","wander","chat"];
const DEF = ()=>({funds:0,total:0,allTime:0,owned:ROLES.map(()=>0),upg:{},papers:0,clicks:0,prestiges:0,last:Date.now(),started:Date.now(),cid:0,crew:[],w:{clock:100,evT:90,broken:[],black:0,fixT:40,log:[],nextName:null,socT:30}});
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && typeof s==="object"){
      const o = Object.assign(DEF(), s);
      if(!Array.isArray(o.owned)) o.owned = ROLES.map(()=>0);
      while(o.owned.length<ROLES.length) o.owned.push(0);
      ["funds","total","allTime","papers","clicks","prestiges"].forEach(k=>{ if(!isFinite(o[k])||o[k]<0) o[k]=0; });
      if(!isFinite(o.last)) o.last=Date.now();
      const dw=DEF().w; o.w=Object.assign(dw,o.w&&typeof o.w==="object"?o.w:{});
      ["clock","evT","black","fixT","socT"].forEach(k=>{ if(!isFinite(o.w[k])) o.w[k]=dw[k]; });
      if(!Array.isArray(o.w.broken)) o.w.broken=[]; if(!Array.isArray(o.w.log)) o.w.log=[];
      if(!Array.isArray(o.crew)) o.crew=[]; if(!isFinite(o.cid)) o.cid=0;
      o.crew=o.crew.filter(c=>c&&isFinite(c.role)&&c.role>=0&&c.role<ROLES.length&&Array.isArray(c.tr)&&typeof c.name==="string");
      o.crew.forEach(c=>{ if(!Array.isArray(c.th)) c.th=[]; ["mood","en","hu"].forEach(k=>{ if(!isFinite(c[k])) c[k]=70; }); if(!JOBS_OK.includes(c.job)) c.job="work"; c.force=c.force||null; c.jt=isFinite(c.jt)?c.jt:0; });
      return o;
    }
  }catch(e){}
  return DEF();
}
let memSave=null;
function save(){
  S.last = Date.now();
  const txt = JSON.stringify(S);
  memSave = txt;
  try{ localStorage.setItem(KEY, txt); }catch(e){}
}
let S = load();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

/* ====================== 계산 ====================== */
let D = null;
function derive(){
  const resM = ROLES.map(()=>1); let allM=1, clickM=1, cpsPct=0;
  for(const u of UPG){
    if(!S.upg[u.id]) continue;
    if(u.type==="res") resM[u.i]*=u.m;
    else if(u.type==="all") allM*=u.m;
    else if(u.type==="click") clickM*=u.m;
    else if(u.type==="cpsclick") cpsPct+=u.v;
  }
  const paperM = 1 + PAPER_BONUS*S.papers;
  let cps = 0;
  const per = ROLES.map((r,i)=>{ const p = r.cps*resM[i]*allM*paperM; cps += p*S.owned[i]*(FACT[i]||1)*evMult(); return p; });
  D = {cps, per, paperM, click: clickM*paperM + cps*cpsPct};
}
function gain(v){ S.funds+=v; S.total+=v; S.allTime+=v; }
function unitCost(i){ return ROLES[i].base*Math.pow(GROW,S.owned[i]); }
function costFor(i,k){ return Math.ceil(unitCost(i)*(Math.pow(GROW,k)-1)/(GROW-1)); }
function maxAff(i){ return Math.max(0, Math.floor(Math.log(S.funds*(GROW-1)/unitCost(i)+1)/Math.log(GROW))); }
function paperGain(){ return Math.floor(Math.sqrt(S.total/PAPER_BASE)); }

function fmt(n){
  if(!isFinite(n)) return "∞";
  if(n<10) return (Math.floor(n*10)/10).toString();
  if(n<1e4) return Math.floor(n).toLocaleString("ko-KR");
  const units=[["해",1e20],["경",1e16],["조",1e12],["억",1e8],["만",1e4]];
  for(const [u,v] of units){
    if(n>=v){
      const x=n/v;
      let s = x>=100? x.toFixed(0) : x>=10? x.toFixed(1) : x.toFixed(2);
      if(s.includes(".")) s=s.replace(/\.?0+$/,"");
      return s+u;
    }
  }
  return Math.floor(n).toLocaleString("ko-KR");
}
function fmtTime(sec){
  sec=Math.floor(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60);
  return h? `${h}시간 ${m}분` : m? `${m}분` : `${sec}초`;
}
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ====================== 아바타(SVG) ====================== */
function avatar(r){
  const hc=r.hc, sk=r.skin;
  const cap = `<path d="M18 30 Q17 11 32 11 Q47 11 46 30 Q41 21 32 21 Q23 21 18 30Z" fill="${hc}"/>`;
  let back="", front="";
  switch(r.hair){
    case "short": front=cap; break;
    case "long": back=`<rect x="15" y="20" width="34" height="32" rx="12" fill="${hc}"/>`; front=cap; break;
    case "bun": back=`<circle cx="32" cy="8" r="6.5" fill="${hc}"/>`; front=cap; break;
    case "curly": front=[[20,18],[27,13],[35,13],[43,18],[17,26],[47,26],[32,16]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7" fill="${hc}"/>`).join(""); break;
    case "bald": front=`<circle cx="18" cy="31" r="3.2" fill="${hc}"/><circle cx="46" cy="31" r="3.2" fill="${hc}"/>`; break;
    case "white": front=`<path d="M17 32 Q15 10 32 10 Q49 10 47 32 Q44 22 32 21 Q20 22 17 32Z" fill="${hc}" stroke="#d1d5db" stroke-width=".8"/>`; break;
    case "side": front=`<path d="M18 30 Q16 12 33 11 Q47 11 46 28 Q40 17 28 20 Q22 22 18 30Z" fill="${hc}"/>`; break;
  }
  let acc="";
  if(r.acc==="glasses") acc=`<g fill="none" stroke="#334155" stroke-width="1.6"><circle cx="26" cy="31" r="4.6"/><circle cx="38" cy="31" r="4.6"/><path d="M30.6 31h2.8"/></g>`;

function experiment(cx,cy){
  const v=D.click; gain(v); S.clicks++;

let tipT=0;
function showTip(txt,cx,cy){
  const scene=$("#scene"), t=$("#tip"); if(!scene||!t) return;

function floatText(host,x,y,t){

function buyCount(i){ return buyMode==="max" ? Math.max(1,maxAff(i)) : buyMode; }
function buy(i){
  const k=buyCount(i), c=costFor(i,k);
  if(S.funds<c) return;
  S.funds-=c; S.owned[i]+=k; syncCrew(); derive();
  const newlyVisible = visibleRoles().length;
  if(tab==="hire" && $("#roles").children.length!==newlyVisible) viewHire();
  refresh(); save();
}

function refresh(){
  $("#fund").textContent = fmt(S.funds)+"원";
  $("#cpsline").textContent = `초당 +${fmt(D.cps)}원 · ${clockText()}${S.crew.length?" "+moodFace(avgMood()):""}`;
  if(tab==="crew") refreshCrew();
  if(tab==="lab"){
    if($("#gl")) syncLab();
    const al=$("#alerts"); if(al){ const h=(S.w.broken.length?S.w.broken.map(id=>`<div class="alert"><div class="grow">⚠ ${esc(equipName(id))} 고장</div><button data-fix="${id}" ${S.funds<repairCost()?"disabled":""}>🔧 수리 ${fmt(repairCost())}원</button></div>`).join(""):"")+S.w.log.slice(0,3).map(l=>`<div class="lg ${l.k}">${l.i} ${esc(l.x)}</div>`).join(""); if(al.dataset.h!==h){ al.innerHTML=h; al.dataset.h=h; al.style.display=h?"":"none"; } }
    const cv=$("#clickval"); if(cv) cv.textContent = `1회 +${fmt(D.click)}원`;
    const g=$("#goal"); if(g){
      const nxt = ROLES.find(r=>r.id===0||S.owned[r.id-1]>0 ? S.owned[r.id]===0 : false) || null;
      let html="";
      const pg=paperGain();
      if(S.owned[0]===0) html=`<h2>첫 목표</h2><div class="sub">실험을 눌러 연구비를 모아 <b>학부 연구생</b>(${fmt(ROLES[0].base)}원)을 뽑아보세요.</div>`;
      else if(nxt) html=`<h2>다음 목표</h2><div class="sub"><b>${esc(nxt.name)}</b> 영입까지 ${fmt(Math.max(0,Math.ceil(nxt.base)-S.funds))}원 남았어요.</div>`;
      else html=`<h2>연구 현황</h2><div class="sub">모든 직급의 연구원이 모였어요. 이제 규모를 키워보세요!</div>`;
      if(pg>=1) html+=`<div class="sub" style="margin-top:6px">📄 논문 <b>${pg}편</b>을 투고할 수 있어요.</div>`;
      if(g.dataset.h!==html){ g.innerHTML=html; g.dataset.h=html; }
    }
  } else if(tab==="hire"){
    $$(".seg button").forEach(b=>b.classList.toggle("on", String(buyMode)===b.dataset.m));
    visibleRoles().forEach(r=>{
      const i=r.id, k=buyCount(i), c=costFor(i,k);
      const o=$("#own"+i); if(!o) return;
      o.textContent = "×"+S.owned[i];
      $("#rcps"+i).textContent = `개당 초당 +${fmt(D.per[i])} · 합계 +${fmt(D.per[i]*S.owned[i])}`;
      const b=$("#buy"+i); b.innerHTML = `구매 ×${k}<small>${fmt(c)}원</small>`; b.disabled = S.funds<c;
    });
  } else if(tab==="upg"){
    const list=availUpg(), sig=list.map(u=>u.id).join(",");
    if(sig!==sigUpg){ viewUpg(); return; }
    list.forEach(u=>{ const b=$("#u_"+u.id); if(b){ b.innerHTML=`구입<small>${fmt(u.cost)}원</small>`; b.disabled=S.funds<u.cost; } });
  } else if(tab==="paper"){
    const g=paperGain();
    $("#pt").textContent=fmt(S.total)+"원"; $("#pg").textContent=g+"편";
    const nextNeed = Math.pow(g+1,2)*PAPER_BASE;
    const prev = g*g*PAPER_BASE;
    $("#pbar").style.width = Math.min(100,((S.total-prev)/(nextNeed-prev))*100)+"%";
    $("#pnext").textContent = `다음 1편까지 누적 연구비 ${fmt(nextNeed)}원 (현재 ${fmt(S.total)}원)`;
    $("#pgo").disabled = g<1;
  }
}
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));

/* ====================== 콜로니 시스템 (림월드식) ====================== */
const DAY=300;   // 게임 속 하루 = 현실 300초
const SUR="김이박최정강조윤장임한오서신권황안송류홍".split("");
const GIV=["민준","서연","지호","하은","도윤","수아","예준","지우","현우","유나","시우","서윤","준서","채원","건우","다은","태양","소율","지훈","하린","재민","나연","승현","예린"];
const TRAITS={
  dil:{n:"근면",d:"작업 효율 +15% · 피로가 더 빨리 쌓임"},
  laz:{n:"게으름",d:"작업 효율 -10% · 피로가 천천히 쌓임"},
  noc:{n:"야행성",d:"밤에 활발하고 낮에 졸려함"},
  opt:{n:"낙천적",d:"기분 +8"},
  sen:{n:"예민",d:"기분 -5 · 번아웃에 취약"},
  fix:{n:"손재주",d:"고장난 장비를 스스로 수리"}
};
const JOBS={work:["🔬","연구 중"],eat:["🍙","식사 중"],sleep:["😴","휴식 중"],brk:["😵","번아웃"],wander:["🚶","휴식 중"],chat:["💬","대화 중"]};
const EQ_IDS=["r0_1","r1_0","r1_1","r2_0","r2_1","r3_0","r3_1","r4_0","r5_0","r5_1","r6_0","r7_0"];
let FACT=ROLES.map(()=>1);
const rr=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function hourNow(){ return ((S.w.clock%DAY)/DAY)*24; }
function isNight(){ const h=hourNow(); return h<6||h>=21; }
function darkness(){
  const h=hourNow(); let d=0;
  if(h<6) d=1; else if(h<8) d=1-(h-6)/2; else if(h<18) d=0; else if(h<21) d=(h-18)/3; else d=1;
  if(S.w.black>0) d=Math.max(d,.9);
  return d;
}
function clockText(){ const h=hourNow(), hh=Math.floor(h), mm=Math.floor((h-hh)*60); return `${isNight()?"🌙":"☀️"} ${Math.floor(S.w.clock/DAY)+1}일차 ${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`; }
function logEv(i,x,k){
  const h=hourNow(), hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  S.w.log.unshift({d:Math.floor(S.w.clock/DAY)+1,h:`${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`,i,x,k:k||""});
  if(S.w.log.length>40) S.w.log.length=40;
}
function addThought(c,t,v,secs){
  const u=S.w.clock+secs, ex=c.th.find(q=>q.t===t);
  if(ex){ ex.v=v; ex.u=u; } else c.th.push({t,v,u});
}
function newCrew(role,quiet){
  const pool=["dil","laz","noc","opt","sen","fix"], tr=[pick(pool)];
  if(Math.random()<.5){ const b=pick(pool); if(!tr.includes(b) && !(tr[0]==="dil"&&b==="laz") && !(tr[0]==="laz"&&b==="dil")) tr.push(b); }
  const nm=S.w.nextName||(pick(SUR)+pick(GIV)); S.w.nextName=null;
  return {id:++S.cid,role,name:nm,tr,mood:72,en:rr(60,95),hu:rr(60,95),job:"work",jt:0,force:null,th:[]};
}
function wantCounts(){
  const w=ROLES.map(()=>0); let left=20;
  ROLES.forEach((r,i)=>{ const c=Math.min(S.owned[i],2,left); w[i]=c; left-=c; });
  for(let i=ROLES.length-1;i>=0&&left>0;i--){ const c=Math.min(S.owned[i]-w[i],2,left); if(c>0){ w[i]+=c; left-=c; } }
  return w;
}
function syncCrew(quiet){
  const w=wantCounts();
  ROLES.forEach((r,i)=>{
    const mine=S.crew.filter(c=>c.role===i);
    for(let k=mine.length;k<w[i];k++){
      const c=newCrew(i); S.crew.push(c);
      if(!quiet){ logEv("👋",`${c.name} (${r.name})이(가) 연구실에 합류했습니다.`,"good"); addThought(c,"새 동료",3,180); }
    }
    for(let k=mine.length;k>w[i];k--) S.crew.splice(S.crew.indexOf(mine[k-1]),1);
  });
}
function traitMult(c){ return (c.tr.includes("dil")?1.15:1)*(c.tr.includes("laz")?.9:1); }
function crewFactor(c){ return c.job==="work" ? (.6+.8*c.mood/100)*traitMult(c)*(c.force==="focus"?1.3:1) : 0; }
function evMult(){ return (S.w.black>0?.5:1)*Math.max(.6,1-.1*S.w.broken.length); }
function avgMood(){ return S.crew.length? S.crew.reduce((a,c)=>a+c.mood,0)/S.crew.length : 70; }
function moodFace(m){ return m>=70?"😊":m>=45?"😐":m>=25?"😟":"😡"; }

function decideJob(c,night,dt){
  const noc=c.tr.includes("noc"), sleepy=noc?!night:night;
  if(c.en<=0 && c.job!=="sleep"){ c.job="sleep"; c.force=null; addThought(c,"과로로 쓰러짐",-10,240); logEv("🚑",`${c.name}이(가) 과로로 쓰러졌습니다.`,"bad"); return; }
  if(c.job==="chat"){
    c.jt-=dt; const p=S.crew.find(x=>x.id===c.pid);
    if(c.jt<=0||!p||p.job!=="chat"){
      c.job="work"; c.pid=0;
      if(c.kind==="spat"){ addThought(c,"말다툼",-5,240); } else addThought(c,"즐거운 대화",4,240);
    }
    return;
  }
  if(c.job==="sleep"){
    const goal=c.force==="rest"?96:(sleepy?95:88);
    if(c.en>=goal){ c.job="work"; addThought(c,"푹 쉬었다",8,360); if(c.force==="rest") c.force=null; }
    return;
  }
  if(c.job==="eat"){
    if(c.hu>=88){ c.job=(c.force==="rest"&&c.en<90)?"sleep":"work"; addThought(c,"식사 만족",5,240); }
    return;
  }
  const brk=c.tr.includes("sen")?22:14;
  if(c.mood<brk && Math.random()<dt*.35){
    c.job="brk"; c.jt=40; c.force=null; logEv("😵",`${c.name}이(가) 번아웃에 빠졌습니다. 잠시 업무를 멈춥니다.`,"bad"); return;
  }
  if(c.force==="rest"){ c.job=c.hu<85?"eat":"sleep"; return; }
  if(c.force==="focus"){ if(c.en<10){ c.force=null; addThought(c,"과로",-8,240); } else { c.job="work"; return; } }
  if(c.hu<28){ c.job="eat"; return; }
  if(c.en<(sleepy?55:18)){ c.job="sleep"; return; }
  c.job="work";
}
function colonyStep(dt){
  const w=S.w; w.clock+=dt; if(w.black>0){ w.black-=dt; if(w.black<=0){ w.black=0; logEv("💡","전력이 복구되었습니다.","good"); } }
  const night=isNight(), now=w.clock, many=S.crew.length>=3;
  for(const c of S.crew){
    for(let i=c.th.length-1;i>=0;i--) if(c.th[i].u<now) c.th.splice(i,1);
    if(c.job==="brk"){ c.jt-=dt; if(c.jt<=0){ c.job="work"; c.mood=Math.max(c.mood,35); addThought(c,"번아웃 후 멍함",-5,180); } }
    else decideJob(c,night,dt);
    const j=c.job, dil=c.tr.includes("dil"), laz=c.tr.includes("laz");
    c.en+= (j==="work"?-.2*(dil?1.25:laz?.8:1):j==="eat"?-.04:j==="sleep"?.85:-.08)*dt;
    c.hu+= (j==="work"?-.13:j==="eat"?2.6:j==="sleep"?-.04:-.1)*dt;
    c.en=Math.max(0,Math.min(100,c.en)); c.hu=Math.max(0,Math.min(100,c.hu));
    let target=22+.28*c.en+.28*c.hu+(c.tr.includes("opt")?8:0)-(c.tr.includes("sen")?5:0);
    for(const t of c.th) target+=t.v;
    if(w.black>0) target-=4; if(c.force==="focus") target-=4; if(c.job==="work"&&night&&!c.tr.includes("noc")) target-=4;
    target=Math.max(0,Math.min(100,target));
    c.mood+=(target-c.mood)*Math.min(1,dt*.35);
  }
  // 사회적 상호작용: 일하는 두 사람이 만나 수다를 떨거나 말다툼
  w.socT-=dt;
  if(w.socT<=0){
    w.socT=rr(25,50);
    const pool=S.crew.filter(c=>c.job==="work"&&!c.force);
    if(pool.length>=2){
      const a=pool.splice(Math.floor(Math.random()*pool.length),1)[0], b=pool[Math.floor(Math.random()*pool.length)];
      const spat=(a.tr.includes("sen")||b.tr.includes("sen"))&&Math.random()<.35, kind=spat?"spat":"good", dur=rr(6,10);
      a.job=b.job="chat"; a.pid=b.id; b.pid=a.id; a.kind=b.kind=kind; a.jt=b.jt=dur;
      if(spat) logEv("💢",`${a.name}와(과) ${b.name}이(가) 말다툼을 했습니다.`,"bad"); else if(Math.random()<.2) logEv("💬",`${a.name}와(과) ${b.name}이(가) 즐겁게 수다를 떱니다.`,"good");
    }
  }
  // 손재주 자동 수리
  if(w.broken.length && S.crew.some(c=>c.tr.includes("fix")&&c.job==="work")){
    w.fixT-=dt; if(w.fixT<=0){ w.fixT=40; const id=w.broken[0]; const who=S.crew.find(c=>c.tr.includes("fix")&&c.job==="work"); doRepair(id,true,who&&who.name); }
  } else w.fixT=Math.max(w.fixT,25);
  // 역할별 생산 계수
  ROLES.forEach((r,i)=>{ const m=S.crew.filter(c=>c.role===i); const t=m.length? m.reduce((a,c)=>a+crewFactor(c),0)/m.length : 1; FACT[i]+=(t-FACT[i])*Math.min(1,dt*1.5); });
  // 사건
  w.evT-=dt; if(w.evT<=0){ w.evT=rr(100,200); fireEvent(); }
}
function equipName(id){ const u=UPG.find(x=>x.id===id); return u?u.name:id; }
function repairCost(){ return Math.ceil(D.cps*15+D.click*5+30); }
function doRepair(id,auto,who){
  const i=S.w.broken.indexOf(id); if(i<0) return false;
  if(!auto){ const c=repairCost(); if(S.funds<c){ toast("연구비가 부족해요"); return false; } S.funds-=c; }
  S.w.broken.splice(i,1); derive();
  logEv("🔧",auto?`${who||"연구원"}이(가) ${equipName(id)}을(를) 수리했습니다.`:`${equipName(id)} 수리 완료!`,"good");
  S.crew.forEach(c=>addThought(c,"장비 수리 완료",3,150));
  save(); if(tab==="lab"||tab==="crew") refresh(); return true;
}
let toastT=0;
function toast(t){ const el=$("#toast"); if(!el) return; el.textContent=t; el.style.display="block"; clearTimeout(toastT); toastT=setTimeout(()=>{ el.style.display="none"; },1800); }
const EVENTS=[
 {w:3,ok:()=>EQ_IDS.some(id=>S.upg[id]&&!S.w.broken.includes(id))&&S.w.broken.length<3,run(){
   const id=pick(EQ_IDS.filter(i=>S.upg[i]&&!S.w.broken.includes(i))); S.w.broken.push(id);
   logEv("⚠️",`${equipName(id)}이(가) 고장났습니다! 수리하지 않으면 생산이 줄어요.`,"bad"); S.crew.forEach(c=>addThought(c,"장비 고장",-6,300)); derive(); }},
 {w:2,ok:()=>D.cps>0,run(){ const v=D.cps*150+D.click*30+50; gain(v); logEv("💰",`교내 지원금 ${fmt(v)}원이 입금되었습니다.`,"good"); }},
 {w:2,ok:()=>S.crew.length>=2,run(){ S.crew.forEach(c=>addThought(c,"간식 파티",10,300)); logEv("🎉","연구실 간식 파티! 모두의 기분이 좋아졌습니다.","good"); }},
 {w:1.5,ok:()=>S.crew.length>=2,run(){ S.crew.forEach(c=>addThought(c,"행정 감사",-6,240)); logEv("📋","행정 감사가 있었습니다. 연구원들이 지쳐 보입니다.","bad"); }},
 {w:1,ok:()=>S.crew.length>=1&&S.w.black<=0,run(){ S.w.black=25; logEv("🔌","정전! 25초 동안 생산이 절반으로 줄어듭니다.","bad"); }},
 {w:1.5,ok:()=>S.owned.reduce((a,b)=>a+b,0)>=3&&!$("#modal").innerHTML,run(){
   let mx=0; S.owned.forEach((n,i)=>{ if(n>0) mx=i; }); const role=Math.floor(Math.random()*(mx+1)), nm=pick(SUR)+pick(GIV);
   logEv("🧑‍🔬",`객원 연구원 ${nm} (${ROLES[role].name})이(가) 합류를 희망합니다.`,"");
   $("#modal").innerHTML=`<div class="modal"><div class="card"><h2>🧑‍🔬 객원 연구원 방문</h2><div class="sub"><b>${esc(nm)}</b> (${esc(ROLES[role].name)})이(가) 연구실에 합류하고 싶어 해요.<br>무료로 영입할 수 있어요.</div>
     <div class="row" style="border:0;gap:8px"><button class="grow" id="vyes">받아들인다</button><button class="grow sec" id="vno">거절한다</button></div></div></div>`;
   $("#vyes").onclick=()=>{ S.owned[role]++; S.w.nextName=nm; derive(); syncCrew(); $("#modal").innerHTML=""; save(); refresh(); };
   $("#vno").onclick=()=>{ $("#modal").innerHTML=""; logEv("🚪",`${nm}의 합류 제안을 정중히 거절했습니다.`,""); };
 }}
];
function fireEvent(){
  const ok=EVENTS.filter(e=>e.ok()); if(!ok.length) return;
  let t=ok.reduce((a,e)=>a+e.w,0)*Math.random(); for(const e of ok){ t-=e.w; if(t<=0){ e.run(); return; } }
  ok[0].run();
}

/* ---- 연구원 화면 ---- */
const moodColor=m=>m>=60?"#16a34a":m>=35?"#f59e0b":"#dc2626";
const bar=(v,c)=>`<div class="mbar"><i style="width:${Math.round(v)}%;background:${c}"></i></div>`;
function jobText(c){ const j=JOBS[c.job]||JOBS.work; return `${j[0]} ${j[1]}${c.force==="rest"?" (휴식 지시)":c.force==="focus"?" (연구 집중)":""}`; }
let crewSig="", crewSec=-1, openCrewId=0;
function viewCrew(){
  $("#app").innerHTML=`
    <div class="card"><h2>👥 연구원 <span id="cn"></span></h2><div class="sub">연구원은 스스로 일하고, 먹고, 쉬어요. 이름을 눌러 지시를 내려보세요. 기분이 낮으면 번아웃에 빠질 수 있어요.</div><div id="cl"></div></div>
    <div class="card"><h2>📜 연구실 일지</h2><div id="lg"></div></div>`;
  $("#cl").addEventListener("click",e=>{ const r=e.target.closest("[data-c]"); if(r) showCrew(+r.dataset.c); });
  crewSec=-1; refreshCrew();
}
function refreshCrew(){
  const sec=Math.floor(S.w.clock); if(sec===crewSec) return; crewSec=sec;
  const cl=$("#cl"); if(!cl) return;
  $("#cn").textContent=`(${S.crew.length}명 · 평균 기분 ${moodFace(avgMood())} ${Math.round(avgMood())})`;
  cl.innerHTML=S.crew.length? S.crew.map(c=>`<div class="row" data-c="${c.id}" style="cursor:pointer"><div class="av">${avatar(ROLES[c.role])}</div>
     <div class="grow"><div class="rn">${esc(c.name)}<span class="pill">${esc(ROLES[c.role].name)}</span></div>
     <div class="sub">${jobText(c)} · ${c.tr.map(t=>TRAITS[t].n).join("·")}</div>${bar(c.mood,moodColor(c.mood))}</div><div class="sub" style="width:34px;text-align:right">${moodFace(c.mood)}</div></div>`).join("")
     : `<div class="empty">아직 연구원이 없어요.<br>인력 탭에서 연구생을 뽑아보세요!</div>`;
  const lg=$("#lg"); if(lg) lg.innerHTML=S.w.log.length? S.w.log.slice(0,25).map(l=>`<div class="lg ${l.k}"><span class="sub">${l.d}일차 ${l.h}</span> ${l.i} ${esc(l.x)}</div>`).join("") : `<div class="empty">아직 기록이 없어요.</div>`;
}
function showCrew(id){
  const c=S.crew.find(x=>x.id===id); if(!c){ openCrewId=0; $("#modal").innerHTML=""; return; }
  openCrewId=id; const r=ROLES[c.role];
  $("#modal").innerHTML=`<div class="modal" id="cm"><div class="card" style="text-align:left">
    <div class="row" style="border:0;padding-top:0"><div class="av" style="width:56px">${avatar(r)}</div><div class="grow"><div class="rn" style="font-size:18px">${esc(c.name)}</div><div class="sub">${esc(r.name)} · ${jobText(c)}</div></div></div>
    <div class="sub" style="margin-bottom:4px">${c.tr.map(t=>`<b>${TRAITS[t].n}</b> ${TRAITS[t].d}`).join("<br>")}</div>
    <div class="nd"><span>기분 ${moodFace(c.mood)}</span>${bar(c.mood,moodColor(c.mood))}<b>${Math.round(c.mood)}</b></div>
    <div class="nd"><span>피로(체력)</span>${bar(c.en,moodColor(c.en))}<b>${Math.round(c.en)}</b></div>
    <div class="nd"><span>허기(포만)</span>${bar(c.hu,moodColor(c.hu))}<b>${Math.round(c.hu)}</b></div>
    <div class="sub" style="margin:8px 0 2px"><b>생각</b></div>
    <div class="sub">${c.th.length? c.th.map(t=>`${t.v>0?"🙂":"🙁"} ${esc(t.t)} (${t.v>0?"+":""}${t.v})`).join("<br>") : "특별한 생각 없음"}</div>
    <div class="row" style="border:0;gap:6px;margin-top:10px"><button class="grow sec" id="crest">😴 휴식 지시</button><button class="grow sec" id="cfocus">🔬 연구 집중</button></div>
    <div class="row" style="border:0;gap:6px;padding-top:0">${c.force?`<button class="grow sec" id="cfree">지시 해제</button>`:""}<button class="grow" id="cclose">닫기</button></div></div></div>`;
  $("#cclose").onclick=()=>{ openCrewId=0; $("#modal").innerHTML=""; };
  $("#cm").addEventListener("pointerdown",e=>{ if(e.target.id==="cm"){ openCrewId=0; $("#modal").innerHTML=""; } });
  $("#crest").onclick=()=>{ c.force="rest"; c.job=c.hu<85?"eat":"sleep"; logEv("🛏️",`${c.name}에게 휴식을 지시했습니다.`,""); showCrew(id); };
  $("#cfocus").onclick=()=>{ if(c.job==="brk"){ toast("번아웃 중엔 지시할 수 없어요"); return; } c.force="focus"; if(c.job!=="work") c.job="work"; logEv("🔬",`${c.name}에게 연구 집중을 지시했습니다.`,""); showCrew(id); };
  const f=$("#cfree"); if(f) f.onclick=()=>{ c.force=null; showCrew(id); };
}

/* ====================== 시간 진행 ====================== */
function showOffline(sec, earned){
  $("#modal").innerHTML = `<div class="modal"><div class="card">
    <h2>☕ 자리를 비운 사이</h2>
    <div class="sub">${fmtTime(sec)} 동안 연구실이 돌아갔어요${sec>OFFLINE_CAP?` (최대 ${OFFLINE_CAP/3600}시간까지 정산)`:""}</div>
    <div class="big">+${fmt(earned)}원</div>
    <button id="mok" style="width:100%">수령하기</button></div></div>`;
  $("#mok").onclick=()=>{ $("#modal").innerHTML=""; };
}
function tick(){
  const now=Date.now();
  let dt=(now-S.last)/1000;
  S.last=now;
  if(dt<0 || !isFinite(dt)) dt=0;
  if(dt>=30){
    const eff=Math.min(dt,OFFLINE_CAP); FACT=FACT.map(()=>.85); derive(); const earned=D.cps*eff;
    S.w.clock+=Math.min(dt,3600); S.crew.forEach(c=>{ c.en=Math.min(100,c.en+40); c.hu=Math.max(35,c.hu); c.job="work"; c.th=[]; c.mood=Math.max(c.mood,60); }); S.w.black=0;
    if(earned>0){ gain(earned); showOffline(dt,earned); }
  } else if(dt>0){
    gain(D.cps*dt);
    colonyStep(dt); if(++dTick%5===0) derive();
    if(openCrewId && Math.floor(S.w.clock)!==modalSec){ modalSec=Math.floor(S.w.clock); if($("#cm")) showCrew(openCrewId); else openCrewId=0; }
  }
  // 연구 아이디어
  if(idea && now>idea.until){ idea=null; const b=$("#ideaBtn"); if(b) b.remove(); nextIdea=now+(50+Math.random()*70)*1000; }
  if(!idea && now>=nextIdea && D.cps>0 && tab==="lab"){
    idea={x:8+Math.random()*78,y:12+Math.random()*50,until:now+12000};
    placeIdea();
  }
  refresh();
}
let saveN=0, dTick=0, modalSec=0;
setInterval(()=>{ tick(); if(++saveN%50===0) save(); },100);
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ save(); } else { tick(); } });
window.addEventListener("pagehide",save);

/* ====================== 시작 ====================== */
syncCrew(true); if(!S.w.log.length) logEv("🏠","HOPE 연구소가 문을 열었습니다. 연구원을 뽑아 연구실을 키워보세요!","good");
derive();
render();

  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
