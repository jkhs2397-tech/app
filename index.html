<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 단어장</title>
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 단어장">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f5f5fa; --card:#fff; --text:#1b1b25; --sub:#6b6b7b; --line:#e4e4ee;
  --pri:#4f46e5; --pri-t:#fff; --ok:#16a34a; --ng:#dc2626; --okbg:#dcfce7; --ngbg:#fee2e2;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#101018; --card:#1b1b27; --text:#f1f1f7; --sub:#9a9ab0; --line:#2c2c3d;
    --pri:#818cf8; --pri-t:#101018; --ok:#4ade80; --ng:#f87171; --okbg:#14391f; --ngbg:#4a1c1c; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  padding-top:env(safe-area-inset-top)}
#app{max-width:640px;margin:0 auto;padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);margin-bottom:8px}
textarea{min-height:110px;resize:vertical}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;background:var(--pri);color:var(--pri-t);cursor:pointer}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--ng);border:1px solid var(--line)}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.grow{flex:1}
.sub{color:var(--sub);font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;background:none;color:var(--sub);border-radius:0;padding:10px 4px 9px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:20px;line-height:1}
.tabs button.on{color:var(--pri)}
.item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .w{font-weight:700;font-size:17px}
.item .m{color:var(--text)}
.item .e{color:var(--sub);font-size:14px;font-style:italic}
.icon{background:none;color:var(--sub);padding:6px 8px;font-size:18px;border-radius:8px}
.big{font-size:32px;font-weight:800;text-align:center;margin:18px 0 6px;word-break:break-word}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);margin-bottom:8px;padding:14px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ng{background:var(--ngbg);border-color:var(--ng)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--pri);width:0}
.fb{padding:10px 12px;border-radius:10px;margin:8px 0;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.ng{background:var(--ngbg);color:var(--ng)}
.flip{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.empty{text-align:center;color:var(--sub);padding:28px 8px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>

<script>
"use strict";
/* ============ 저장소 ============ */
const KEY = "vocab.v1";
let mem = null; // localStorage 사용 불가 시 대비
function load(){
  try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){}
  return mem || {words:[], log:[]};
}
let db = load();
function save(){
  mem = db;
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){}
}
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

/* ============ 유틸 ============ */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g," ");
function speak(t){
  try{
    const u = new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ 상태 ============ */
let tab = "words";
let search = "";
let editId = null;
let quiz = null;           // 진행 중인 퀴즈
let quizCfg = {mode:"mix", count:"10"};

const TABS = [["words","📖","단어장"],["quiz","✏️","퀴즈"],["stats","📊","통계"],["data","💾","백업"]];
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?"on":""}"><span>${t[1]}</span>${t[2]}</button>`).join("");
}
$("#tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  tab=b.dataset.t; render();
});
function render(){
  renderTabs();
  const v = {words:viewWords, quiz:viewQuiz, stats:viewStats, data:viewData}[tab];
  v(); window.scrollTo(0,0);
}

/* ============ 단어장 ============ */
function viewWords(){
  const app=$("#app");
  const ed = editId ? db.words.find(w=>w.id===editId) : null;
  app.innerHTML = `
    <h1>단어장 <span class="sub">${db.words.length}개</span></h1>
    <div class="card">
      <h2>${ed?"단어 수정":"단어 추가"}</h2>
      <input id="fw" placeholder="영어 단어 (예: resilient)" autocapitalize="none" autocorrect="off" value="${esc(ed?ed.w:"")}">
      <input id="fm" placeholder="뜻 (예: 회복력 있는)" value="${esc(ed?ed.m:"")}">
      <input id="fe" placeholder="예문 (선택)" autocapitalize="none" value="${esc(ed?ed.e:"")}">
      <div class="row">
        <button id="fsave">${ed?"수정 저장":"추가"}</button>
        ${ed?'<button class="sec" id="fcancel">취소</button>':""}
      </div>
    </div>
    <input id="fs" type="search" placeholder="검색 (단어 또는 뜻)" value="${esc(search)}">
    <div class="card" id="list"></div>`;
  $("#fsave").onclick = ()=>{
    const w=$("#fw").value.trim(), m=$("#fm").value.trim(), e=$("#fe").value.trim();
    if(!w||!m){ alert("영어 단어와 뜻을 모두 입력해주세요."); return; }
    if(ed){ ed.w=w; ed.m=m; ed.e=e; editId=null; }
    else{
      if(db.words.some(x=>norm(x.w)===norm(w)) && !confirm(`"${w}" 는 이미 있어요. 그래도 추가할까요?`)) return;
      db.words.unshift({id:uid(),w,m,e,box:0,ok:0,ng:0,last:0});
    }
    save(); viewWords();
  };
  if(ed) $("#fcancel").onclick=()=>{editId=null;viewWords();};
  $("#fs").oninput=e=>{search=e.target.value; drawList();};
  $("#list").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    const id=b.dataset.id, w=db.words.find(x=>x.id===id);
    if(b.dataset.a==="say") speak(w.w);
    if(b.dataset.a==="edit"){ editId=id; viewWords(); window.scrollTo(0,0); }
    if(b.dataset.a==="del" && confirm(`"${w.w}" 를 삭제할까요?`)){ db.words=db.words.filter(x=>x.id!==id); save(); viewWords(); }
  });
  drawList();
}
function drawList(){
  const q=norm(search);
  const list=db.words.filter(w=>!q||norm(w.w).includes(q)||norm(w.m).includes(q));
  $("#list").innerHTML = list.length ? list.map(w=>`
    <div class="item">
      <div class="grow">
        <div class="w">${esc(w.w)} <span class="pill">Lv.${w.box}</span></div>
        <div class="m">${esc(w.m)}</div>
        ${w.e?`<div class="e">${esc(w.e)}</div>`:""}
      </div>
      <button class="icon" data-a="say" data-id="${w.id}" aria-label="발음">🔊</button>
      <button class="icon" data-a="edit" data-id="${w.id}" aria-label="수정">✏️</button>
      <button class="icon" data-a="del" data-id="${w.id}" aria-label="삭제">🗑️</button>
    </div>`).join("") : `<div class="empty">${db.words.length?"검색 결과가 없어요.":"아직 단어가 없어요.<br>위에서 추가하거나 '백업' 탭에서 한꺼번에 가져오세요."}</div>`;
}

/* ============ 퀴즈 ============ */
function viewQuiz(){
  if(!quiz) return quizSetup();
  if(quiz.done) return quizResult();
  quizQuestion();
}
function quizSetup(){
  const n=db.words.length;
  $("#app").innerHTML = `
    <h1>퀴즈</h1>
    <div class="card">
      <label class="sub">방식</label>
      <select id="qm">
        <option value="mix">섞어서 출제</option>
        <option value="en2ko">객관식 (영어 → 뜻)</option>
        <option value="ko2en">객관식 (뜻 → 영어)</option>
        <option value="spell">스펠링 입력 (뜻 → 영어)</option>
        <option value="card">카드 뒤집기</option>
      </select>
      <label class="sub">문제 수</label>
      <select id="qc">
        <option value="10">10문제</option><option value="20">20문제</option>
        <option value="all">전체</option><option value="weak">틀린 적 있는 단어만</option>
      </select>
      <button id="qgo" style="width:100%" ${n<1?"disabled":""}>시작</button>
      <p class="sub">${n<1?"단어를 먼저 추가해주세요.":n<4?"객관식은 단어가 4개 이상일 때 나옵니다. 지금은 스펠링으로 출제돼요.":"자주 틀리거나 레벨이 낮은 단어가 더 자주 나와요."}</p>
    </div>`;
  $("#qm").value=quizCfg.mode; $("#qc").value=quizCfg.count;
  $("#qgo").onclick=()=>{
    quizCfg={mode:$("#qm").value,count:$("#qc").value};
    startQuiz();
  };
}
function weightedPick(pool,k){
  const items=pool.map(w=>({w,x:(1+(4-w.box)+Math.min(w.ng,5))}));
  const out=[];
  while(out.length<k && items.length){
    let tot=items.reduce((s,i)=>s+i.x,0), r=Math.random()*tot, idx=0;
    for(;idx<items.length;idx++){ r-=items[idx].x; if(r<=0) break; }
    idx=Math.min(idx,items.length-1);
    out.push(items.splice(idx,1)[0].w);
  }
  return out;
}
function startQuiz(){
  let pool=db.words.slice();
  if(quizCfg.count==="weak"){ pool=pool.filter(w=>w.ng>0); if(!pool.length){ alert("아직 틀린 단어가 없어요."); return; } }
  const k = (quizCfg.count==="all"||quizCfg.count==="weak") ? pool.length : Math.min(+quizCfg.count,pool.length);
  const picked = shuffle(weightedPick(pool,k));
  const canMC = db.words.length>=4;
  const modes=["en2ko","ko2en","spell"];
  const qs = picked.map(w=>{
    let m=quizCfg.mode;
    if(m==="mix") m = modes[Math.floor(Math.random()*modes.length)];
    if((m==="en2ko"||m==="ko2en") && !canMC) m="spell";
    return {id:w.id, mode:m};
  });
  quiz={qs,i:0,right:0,wrong:[],answered:false,flipped:false,opts:null,done:false};
  render();
}
function record(id,ok){
  const w=db.words.find(x=>x.id===id); if(!w) return;
  if(ok){ w.ok++; w.box=Math.min(4,w.box+1); } else { w.ng++; w.box=0; }
  w.last=Date.now();
  db.log.push({t:Date.now(),ok:ok?1:0});
  if(db.log.length>5000) db.log=db.log.slice(-5000);
  save();
}
function makeOptions(q,w){
  const correct = q.mode==="en2ko" ? w.m : w.w;
  const others = shuffle(db.words.filter(x=>x.id!==w.id)
    .map(x=>q.mode==="en2ko"?x.m:x.w)
    .filter((v,i,a)=>norm(v)!==norm(correct)&&a.findIndex(y=>norm(y)===norm(v))===i)).slice(0,3);
  return shuffle([correct,...others]).map(t=>({t,ok:norm(t)===norm(correct)}));
}
function quizHead(){
  const total=quiz.qs.length;
  return `<div class="row" style="align-items:center;margin-bottom:0">
      <div class="sub">${quiz.i+1} / ${total}</div>
      <div style="flex:0"><button class="sec" id="qquit" style="padding:6px 12px">중단</button></div>
    </div>
    <div class="bar"><i style="width:${(quiz.i/total)*100}%"></i></div>`;
}
function quizQuestion(){
  const q=quiz.qs[quiz.i];
  const w=db.words.find(x=>x.id===q.id);
  if(!w){ quiz.i++; if(quiz.i>=quiz.qs.length){quiz.done=true;} return render(); }
  const app=$("#app");
  let body="";
  if(q.mode==="en2ko"||q.mode==="ko2en"){
    if(!quiz.opts) quiz.opts=makeOptions(q,w);
    const prompt = q.mode==="en2ko" ? esc(w.w) : esc(w.m);
    body = `<div class="big">${prompt}</div>
      ${q.mode==="en2ko"?`<div style="text-align:center;margin-bottom:12px"><button class="sec" id="qsay">🔊 발음</button></div>`:`<div class="sub" style="text-align:center;margin-bottom:12px">알맞은 영어 단어를 고르세요</div>`}
      ${quiz.opts.map((o,i)=>`<button class="opt ${quiz.answered?(o.ok?"ok":(o.pick?"ng":"")):""}" data-i="${i}" ${quiz.answered?"disabled":""}>${esc(o.t)}</button>`).join("")}`;
  } else if(q.mode==="spell"){
    body = `<div class="sub" style="text-align:center">뜻을 보고 영어로 쓰세요</div>
      <div class="big">${esc(w.m)}</div>
      <input id="qin" placeholder="영어 단어 입력" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false" ${quiz.answered?"disabled":""} value="${esc(quiz.typed||"")}">
      ${quiz.answered?"":`<button id="qcheck" style="width:100%">확인</button>`}`;
  } else { // card
    body = `<div class="card flip" id="qflip">
      ${quiz.flipped
        ? `<div class="big" style="margin:0">${esc(w.m)}</div>${w.e?`<div class="e sub" style="margin-top:8px">${esc(w.e)}</div>`:""}<div class="sub" style="margin-top:8px">${esc(w.w)}</div>`
        : `<div class="big" style="margin:0">${esc(w.w)}</div><div class="sub" style="margin-top:10px">탭해서 뜻 보기</div>`}
      </div>
      ${quiz.flipped && !quiz.answered?`<div class="row"><button class="danger" id="cno">몰랐어요</button><button id="cyes">알았어요</button></div>`:""}`;
  }
  const fb = quiz.answered && quiz.fb ? `<div class="fb ${quiz.fb.ok?"ok":"ng"}">${quiz.fb.text}</div>` : "";
  const next = quiz.answered ? `<button id="qnext" style="width:100%;margin-top:6px">${quiz.i+1>=quiz.qs.length?"결과 보기":"다음"}</button>` : "";
  app.innerHTML = quizHead()+body+fb+next;

  $("#qquit").onclick=()=>{ if(confirm("퀴즈를 중단할까요?")){ quiz=null; render(); } };
  if($("#qsay")) $("#qsay").onclick=()=>speak(w.w);
  if($("#qnext")) $("#qnext").onclick=()=>{
    quiz.i++; quiz.answered=false; quiz.flipped=false; quiz.opts=null; quiz.fb=null; quiz.typed="";
    if(quiz.i>=quiz.qs.length) quiz.done=true;
    render();
  };
  if(q.mode==="en2ko"||q.mode==="ko2en"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(quiz.answered) return;
      const o=quiz.opts[+b.dataset.i]; o.pick=true;
      answer(w,o.ok, o.ok?"정답!":`오답 · 정답: ${esc(q.mode==="en2ko"?w.m:w.w)}`);
      if(q.mode==="ko2en") speak(w.w);
    });
  } else if(q.mode==="spell"){
    const inp=$("#qin");
    if(!quiz.answered){
      setTimeout(()=>inp&&inp.focus(),50);
      const check=()=>{
        quiz.typed=inp.value;
        if(!inp.value.trim()) return;
        const ok = norm(inp.value)===norm(w.w);
        answer(w,ok, ok?"정답!":`오답 · 정답: ${esc(w.w)}`);
        speak(w.w);
      };
      $("#qcheck").onclick=check;
      inp.onkeydown=e=>{ if(e.key==="Enter") check(); };
    }
  } else {
    const f=$("#qflip");
    if(f) f.onclick=()=>{ if(!quiz.flipped){ quiz.flipped=true; speak(w.w); render(); } };
    if($("#cyes")) $("#cyes").onclick=()=>{ answerCard(w,true); };
    if($("#cno")) $("#cno").onclick=()=>{ answerCard(w,false); };
  }
}
function answer(w,ok,text){
  quiz.answered=true; quiz.fb={ok,text};
  if(ok) quiz.right++; else quiz.wrong.push(w.id);
  record(w.id,ok);
  quizQuestion();
}
function answerCard(w,ok){
  // 카드는 바로 다음 문제로
  if(ok) quiz.right++; else quiz.wrong.push(w.id);
  record(w.id,ok);
  quiz.i++; quiz.flipped=false; quiz.answered=false; quiz.opts=null; quiz.fb=null;
  if(quiz.i>=quiz.qs.length) quiz.done=true;
  render();
}
function quizResult(){
  const total=quiz.qs.length, pct=total?Math.round(quiz.right/total*100):0;
  const wrongWords=quiz.wrong.map(id=>db.words.find(w=>w.id===id)).filter(Boolean);
  $("#app").innerHTML = `
    <h1>결과</h1>
    <div class="card" style="text-align:center">
      <div class="big" style="margin:4px 0">${quiz.right} / ${total}</div>
      <div class="sub">정답률 ${pct}%</div>
    </div>
    ${wrongWords.length?`<div class="card"><h2>틀린 단어</h2>${wrongWords.map(w=>`
      <div class="item"><div class="grow"><div class="w">${esc(w.w)}</div><div class="m">${esc(w.m)}</div></div>
      <button class="icon" data-say="${w.id}">🔊</button></div>`).join("")}</div>`:`<div class="card empty">모두 맞혔어요! 🎉</div>`}
    <div class="row"><button id="again">다시 풀기</button><button class="sec" id="home">처음으로</button></div>`;
  $("#app").querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>{const w=db.words.find(x=>x.id===b.dataset.say); if(w) speak(w.w);});
  $("#again").onclick=startQuiz;
  $("#home").onclick=()=>{quiz=null;render();};
}

/* ============ 통계 ============ */
function viewStats(){
  const ws=db.words, tot=ws.reduce((s,w)=>s+w.ok+w.ng,0), ok=ws.reduce((s,w)=>s+w.ok,0);
  const rate = tot?Math.round(ok/tot*100):0;
  const mastered=ws.filter(w=>w.box>=4).length;
  const days=new Set(db.log.map(l=>new Date(l.t).toDateString())).size;
  const weak=ws.filter(w=>w.ng>0).sort((a,b)=>(b.ng-b.ok*.5)-(a.ng-a.ok*.5)).slice(0,10);
  const today=db.log.filter(l=>new Date(l.t).toDateString()===new Date().toDateString());
  $("#app").innerHTML = `
    <h1>통계</h1>
    <div class="stat">
      <div><b>${ws.length}</b><span class="sub">전체 단어</span></div>
      <div><b>${mastered}</b><span class="sub">암기 완료</span></div>
      <div><b>${rate}%</b><span class="sub">전체 정답률</span></div>
      <div><b>${today.length}</b><span class="sub">오늘 푼 문제</span></div>
      <div><b>${days}</b><span class="sub">학습한 날</span></div>
      <div><b>${tot}</b><span class="sub">누적 문제</span></div>
    </div>
    <div class="card"><h2>약한 단어</h2>${weak.length?weak.map(w=>`
      <div class="item"><div class="grow"><div class="w">${esc(w.w)}</div><div class="m">${esc(w.m)}</div></div>
      <span class="pill">오답 ${w.ng} · 정답 ${w.ok}</span></div>`).join(""):`<div class="empty">틀린 단어가 아직 없어요.</div>`}</div>
    <p class="sub">Lv.4 에 도달하면 '암기 완료'로 계산해요. 틀리면 Lv.0 으로 돌아가요.</p>`;
}

/* ============ 백업 ============ */
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  const sep = text.includes("\t") && !text.includes(",") ? "\t" : ",";
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else if(c==='"') q=true;
    else if(c===sep){ row.push(cur); cur=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cur); cur=""; rows.push(row); row=[]; }
    else cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
function toCSV(){
  const q=s=>`"${String(s||"").replace(/"/g,'""')}"`;
  return "word,meaning,example\n"+db.words.map(w=>[q(w.w),q(w.m),q(w.e)].join(",")).join("\n");
}
function download(name,text,type){
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{type}));
    a.download=name; document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ alert("파일 저장이 안 되면 아래 '복사' 버튼을 사용하세요."); }
}
function viewData(){
  $("#app").innerHTML = `
    <h1>백업 · 가져오기</h1>
    <div class="card">
      <h2>단어 한꺼번에 추가</h2>
      <p class="sub">한 줄에 하나씩 <b>영어,뜻,예문</b> 형태로 붙여넣으세요. 엑셀에서 복사해도 돼요. (예문은 생략 가능)</p>
      <textarea id="imp" placeholder="apple,사과,I ate an apple.&#10;resilient,회복력 있는"></textarea>
      <input type="file" id="impf" accept=".csv,.txt,.json,text/csv,text/plain,application/json">
      <button id="impgo" style="width:100%">가져오기</button>
      <div id="impmsg" class="sub" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <h2>내보내기 (백업)</h2>
      <p class="sub">기기 데이터는 브라우저 설정에 따라 지워질 수 있으니 가끔 백업하세요.</p>
      <div class="row">
        <button id="exj">전체 백업(JSON) 저장</button>
        <button class="sec" id="exc">단어만 CSV 저장</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="sec" id="cpj">백업 텍스트 복사</button>
      </div>
      <p class="sub" style="margin-bottom:0">JSON 백업은 학습 기록(레벨, 정답 수)까지 포함해요. 복구할 때는 위 가져오기에 JSON 내용을 붙여넣으세요.</p>
    </div>
    <div class="card">
      <h2>초기화</h2>
      <button class="danger" id="wipe" style="width:100%">모든 데이터 삭제</button>
    </div>`;
  const msg=t=>$("#impmsg").textContent=t;
  $("#impf").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ $("#imp").value=r.result; msg(`${f.name} 내용을 불러왔어요. '가져오기'를 누르세요.`); }; r.readAsText(f);
  };
  $("#impgo").onclick=()=>{
    const t=$("#imp").value.trim(); if(!t){ msg("가져올 내용이 없어요."); return; }
    // JSON 백업 복원
    if(t[0]==="{"){
      try{
        const d=JSON.parse(t);
        if(!Array.isArray(d.words)) throw 0;
        if(!confirm(`백업에서 단어 ${d.words.length}개를 복원합니다. 현재 데이터는 덮어써져요. 계속할까요?`)) return;
        db={words:d.words.map(w=>({id:w.id||uid(),w:w.w,m:w.m,e:w.e||"",box:w.box|0,ok:w.ok|0,ng:w.ng|0,last:w.last|0})),log:Array.isArray(d.log)?d.log:[]};
        save(); msg("복원 완료!"); return;
      }catch(e){ msg("JSON 형식이 올바르지 않아요."); return; }
    }
    let rows=parseCSV(t);
    if(rows.length && /^(word|영어|단어)$/i.test(rows[0][0].trim())) rows.shift();
    let add=0, dup=0, bad=0;
    const have=new Set(db.words.map(w=>norm(w.w)));
    const fresh=[];
    rows.forEach(r=>{
      const w=(r[0]||"").trim(), m=(r[1]||"").trim(), e=(r[2]||"").trim();
      if(!w||!m){ bad++; return; }
      if(have.has(norm(w))){ dup++; return; }
      have.add(norm(w)); fresh.push({id:uid(),w,m,e,box:0,ok:0,ng:0,last:0}); add++;
    });
    db.words=fresh.concat(db.words); save();
    msg(`추가 ${add}개 · 중복 건너뜀 ${dup}개 · 형식 오류 ${bad}개`);
    if(add) $("#imp").value="";
  };
  const stamp=new Date().toISOString().slice(0,10);
  $("#exj").onclick=()=>download(`vocab-backup-${stamp}.json`,JSON.stringify(db),"application/json");
  $("#exc").onclick=()=>download(`vocab-words-${stamp}.csv`,"﻿"+toCSV(),"text/csv");
  $("#cpj").onclick=async()=>{
    try{ await navigator.clipboard.writeText(JSON.stringify(db)); msg("복사했어요. 메모 앱 등에 붙여넣어 보관하세요."); }
    catch(e){ $("#imp").value=JSON.stringify(db); msg("자동 복사가 막혀서 위 입력창에 넣어뒀어요. 전체 선택 후 복사하세요."); }
  };
  $("#wipe").onclick=()=>{
    if(confirm("모든 단어와 학습 기록이 삭제됩니다. 정말 삭제할까요?") && confirm("되돌릴 수 없어요. 마지막 확인입니다.")){
      db={words:[],log:[]}; save(); quiz=null; render();
    }
  };
}

/* ============ 시작 ============ */
render();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
